<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b57d0"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Nota Spese"><link rel="manifest" href="manifest.json"><title>Nota Spese</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f6f9;color:#18202a}main{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px)}h1{text-align:center;font-size:24px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}input,select,button{width:100%;font-size:16px;padding:12px;margin:6px 0;border:1px solid #ccd2da;border-radius:10px}button{background:#0b57d0;color:white;border:0;font-weight:600}.secondary{background:#59636e}.danger{background:#b3261e}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.expense{border-top:1px solid #e6e8eb;padding:10px 0;display:flex;justify-content:space-between;gap:12px}.small{font-size:13px;color:#667085}.total{font-size:19px;font-weight:700}.hidden{display:none}#status{text-align:center;font-size:14px}.photo{max-width:100%;max-height:180px;border-radius:10px}</style></head><body><main><h1>NOTA SPESE</h1><section class="card"><input id="nome" placeholder="Nome"><input id="cognome" placeholder="Cognome"><input id="azienda" placeholder="Azienda di riferimento"><input id="mese" type="month"><button onclick="saveProfile()">Salva intestazione</button></section><section class="card"><label><b>Fotografa scontrino</b></label><input id="camera" type="file" accept="image/*" capture="environment"><div id="status"></div><img id="preview" class="photo hidden"><input id="data" type="date"><input id="esercente" placeholder="Esercente / descrizione"><div class="row"><input id="importo" type="number" inputmode="decimal" step="0.01" placeholder="Importo"><select id="valuta"><option>CHF</option><option>EUR</option></select></div><button onclick="addExpense()">Aggiungi spesa</button></section><section class="card"><b>Totali del mese</b><div id="totals"></div></section><section class="card"><b>Spese</b><div id="list"></div></section><section class="card"><b>Cancella per periodo</b><div class="row"><input id="dal" type="date"><input id="al" type="date"></div><button class="danger" onclick="deleteRange()">Cancella dalla data / alla data</button></section><button onclick="printReport()">Stampa / salva PDF nota spese</button><p class="small" style="text-align:center">I dati restano memorizzati sul dispositivo.</p></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>let expenses=JSON.parse(localStorage.getItem('expenses')||'[]'),img='';const $=id=>document.getElementById(id);function today(){return new Date().toISOString().slice(0,10)}function currentMonth(){return new Date().toISOString().slice(0,7)}function load(){let p=JSON.parse(localStorage.getItem('profile')||'{}');['nome','cognome','azienda'].forEach(k=>$(k).value=p[k]||'');$('mese').value=p.mese||currentMonth();$('data').value=today();render()}function saveProfile(){let p={nome:$('nome').value,cognome:$('cognome').value,azienda:$('azienda').value,mese:$('mese').value};localStorage.setItem('profile',JSON.stringify(p));render()}$('mese').addEventListener('change',saveProfile);$('camera').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;img=await toDataURL(f);$('preview').src=img;$('preview').classList.remove('hidden');$('status').textContent='Lettura scontrino in corso…';try{let r=await Tesseract.recognize(f,'ita+eng');parseOCR(r.data.text);$('status').textContent='Lettura completata: controlla i dati.'}catch(x){$('status').textContent='Foto acquisita. Inserisci o controlla i dati manualmente.'}});function toDataURL(f){return new Promise(r=>{let x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)})}function parseOCR(t){let lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean);$('esercente').value=lines.find(x=>/[A-Za-zÀ-ÿ]{3}/.test(x))||'Scontrino';let totals=lines.filter(x=>/totale|total|importo/i.test(x)),nums=(totals.join(' ')||t).match(/\d{1,6}[.,]\d{2}/g)||[];$('importo').value=Math.max(0,...nums.map(x=>parseFloat(x.replace(',','.')))).toFixed(2);$('valuta').value=/€|EUR/i.test(t)?'EUR':'CHF';let d=t.match(/\b([0-3]?\d)[./-]([01]?\d)[./-](20\d{2}|\d{2})\b/);if(d){let y=d[3].length==2?'20'+d[3]:d[3];$('data').value=`${y}-${d[2].padStart(2,'0')}-${d[1].padStart(2,'0')}`}}function addExpense(){let a=parseFloat($('importo').value);if(!a||!$('data').value)return alert('Inserisci data e importo.');expenses.push({id:Date.now(),date:$('data').value,merchant:$('esercente').value||'Spesa',amount:a,currency:$('valuta').value,image:img});save();$('esercente').value='';$('importo').value='';img='';$('preview').classList.add('hidden');$('camera').value=''}function save(){localStorage.setItem('expenses',JSON.stringify(expenses));render()}function filtered(){return expenses.filter(e=>e.date.slice(0,7)==$('mese').value).sort((a,b)=>a.date.localeCompare(b.date))}function render(){let f=filtered(),tot={};f.forEach(e=>tot[e.currency]=(tot[e.currency]||0)+e.amount);$('totals').innerHTML=Object.keys(tot).length?Object.entries(tot).map(([c,v])=>`<div class="total">${c} ${v.toFixed(2)}</div>`).join(''):'<div class="small">Nessuna spesa</div>';$('list').innerHTML=f.map(e=>`<div class="expense"><div><b>${esc(e.merchant)}</b><div class="small">${fmt(e.date)}</div></div><div style="text-align:right"><b>${e.currency} ${e.amount.toFixed(2)}</b><br><button class="danger" style="width:auto;padding:5px 9px" onclick="del(${e.id})">Elimina</button></div></div>`).join('')||'<div class="small">Nessuna spesa nel mese selezionato</div>'}function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function fmt(d){let [y,m,g]=d.split('-');return `${g}/${m}/${y}`}function del(id){if(confirm('Eliminare questa spesa?')){expenses=expenses.filter(e=>e.id!==id);save()}}function deleteRange(){let a=$('dal').value,b=$('al').value;if(!a||!b||a>b)return alert('Controlla le date.');let n=expenses.filter(e=>e.date>=a&&e.date<=b).length;if(n&&confirm(`Eliminare ${n} spese?`)){expenses=expenses.filter(e=>e.date<a||e.date>b);save()}}function printReport(){let p=JSON.parse(localStorage.getItem('profile')||'{}'),f=filtered(),tot={};f.forEach(e=>tot[e.currency]=(tot[e.currency]||0)+e.amount);let rows=f.map(e=>`<tr><td>${fmt(e.date)}</td><td>${esc(e.merchant)}</td><td>${e.currency}</td><td style="text-align:right">${e.amount.toFixed(2)}</td></tr>`).join('');let w=window.open('','_blank');w.document.write(`<html><head><title>Nota Spese ${p.mese||''}</title><style>body{font-family:Arial;padding:35px;color:#222}h1{border-bottom:3px solid #222;padding-bottom:12px}table{width:100%;border-collapse:collapse;margin-top:25px}th,td{padding:9px;border-bottom:1px solid #ccc;text-align:left}.sig{margin-top:70px;display:flex;justify-content:space-between}.sig div{width:44%;border-top:1px solid #333;padding-top:8px}@media print{button{display:none}}</style></head><body><h1>NOTA SPESE</h1><p><b>Dipendente:</b> ${esc((p.nome||'')+' '+(p.cognome||''))}<br><b>Azienda:</b> ${esc(p.azienda||'')}<br><b>Mese:</b> ${p.mese||''}</p><table><thead><tr><th>Data</th><th>Descrizione</th><th>Valuta</th><th>Importo</th></tr></thead><tbody>${rows}</tbody></table><h3>Totali: ${Object.entries(tot).map(([c,v])=>c+' '+v.toFixed(2)).join(' · ')}</h3><p style="margin-top:45px">Dichiaro che le spese sopra indicate sono state sostenute nell'interesse dell'azienda.</p><div class="sig"><div>Luogo e data</div><div>Firma del dipendente</div></div><script>setTimeout(()=>window.print(),300)<\/script></body></html>`);w.document.close()}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');load();</script></body></html>
