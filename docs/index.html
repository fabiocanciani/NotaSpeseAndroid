<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b57d0"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Nota Spese"><link rel="manifest" href="manifest.json"><title>Nota Spese</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f6f9;color:#18202a}main{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px)}h1{text-align:center;font-size:24px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}input,select,button{width:100%;font-size:16px;padding:12px;margin:6px 0;border:1px solid #ccd2da;border-radius:10px}button{background:#0b57d0;color:white;border:0;font-weight:600}.secondary{background:#59636e}.danger{background:#b3261e}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.expense{border-top:1px solid #e6e8eb;padding:10px 0;display:flex;justify-content:space-between;gap:12px}.small{font-size:13px;color:#667085}.total{font-size:19px;font-weight:700}.hidden{display:none}#status{text-align:center;font-size:14px}.photo{max-width:100%;max-height:180px;border-radius:10px}.picker{position:relative;display:block;background:#0b57d0;color:white;text-align:center;border-radius:10px;padding:13px;margin:8px 0;font-weight:600;overflow:hidden}.picker input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;padding:0;cursor:pointer}</style></head><body><main><h1>NOTA SPESE</h1><section class="card"><input id="nome" placeholder="Nome"><input id="cognome" placeholder="Cognome"><input id="azienda" placeholder="Azienda di riferimento"><input id="mese" type="month"><button onclick="saveProfile()">Salva intestazione</button></section><section class="card"><h2 style="font-size:18px">Acquisisci giustificativo</h2><label class="picker">📷 Fotografa scontrino<input id="camera" type="file" accept="image/*" capture="environment"></label><label class="picker">🖼 Importa immagine<input id="gallery" type="file" accept="image/*"></label><label class="picker">📄 Importa PDF<input id="pdf" type="file" accept="application/pdf,.pdf"></label><div id="filename" class="small"></div><div id="status"></div><img id="preview" class="photo hidden"><input id="data" type="date"><input id="esercente" placeholder="Esercente / descrizione"><div class="row"><input id="importo" type="number" inputmode="decimal" step="0.01" placeholder="Importo"><select id="valuta"><option>CHF</option><option>EUR</option></select></div><button onclick="addExpense()">Aggiungi spesa</button></section><section class="card"><b>Totali del mese</b><div id="totals"></div></section><section class="card"><b>Spese</b><div id="list"></div></section><section class="card"><b>Cancella per periodo</b><div class="row"><input id="dal" type="date"><input id="al" type="date"></div><button class="danger" onclick="deleteRange()">Cancella dalla data / alla data</button></section><button onclick="printReport()">Stampa / salva PDF nota spese</button><section class="card"><b>Archivio locale – versione 3.1</b><div id="dbstatus" class="small">Apertura archivio…</div><button onclick="backup()">Esporta backup completo</button><button class="secondary" onclick="$('restore').click()">Ripristina backup</button><input id="restore" class="hidden" type="file" accept=".json,application/json"></section><p class="small" style="text-align:center">I dati restano memorizzati sul dispositivo.</p></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script><script>let expenses=[],img='',db,ready=false,writing=false;const $=id=>document.getElementById(id);function today(){return new Date().toISOString().slice(0,10)}function currentMonth(){return new Date().toISOString().slice(0,7)}function load(){let p=JSON.parse(localStorage.getItem('profile')||'{}');['nome','cognome','azienda'].forEach(k=>$(k).value=p[k]||'');$('mese').value=p.mese||currentMonth();$('data').value=today();render()}function saveProfile(){let p={nome:$('nome').value,cognome:$('cognome').value,azienda:$('azienda').value,mese:$('mese').value};localStorage.setItem('profile',JSON.stringify(p));render()}$('mese').addEventListener('change',saveProfile);let attachmentName='',busy=false;for(const id of ['camera','gallery','pdf'])$(id).addEventListener('change',async e=>{const f=e.target.files[0];if(!f||busy)return;busy=true;img='';attachmentName=f.name;$('filename').textContent=f.name;$('preview').classList.add('hidden');$('status').textContent='Lettura in corso…';try{img=await toDataURL(f);if(f.type.startsWith('image/')){try{img=await compress(f)}catch(e){}}let t='';if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;for(let i=1;i<=doc.numPages;i++){const p=await doc.getPage(i),content=await p.getTextContent();let line=content.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('');if(line.trim().length<20){const v=p.getViewport({scale:2}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;line=(await Tesseract.recognize(c,'ita+eng')).data.text}t+=line+'\n'}}else{$('preview').src=img;$('preview').classList.remove('hidden');t=(await Tesseract.recognize(f,'ita+eng')).data.text}parseOCR(t);$('status').textContent='Lettura completata: verifica i dati.'}catch(err){$('status').textContent='Lettura non riuscita. Inserisci i dati manualmente.'}finally{busy=false;e.target.value=''}});function toDataURL(f){return new Promise((r,j)=>{let x=new FileReader;x.onload=()=>r(x.result);x.onerror=()=>j(x.error);x.readAsDataURL(f)})}function parseOCR(t){let lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean);$('esercente').value=lines.find(x=>/[A-Za-zÀ-ÿ]{3}/.test(x))||'Scontrino';let totals=lines.filter(x=>/totale|total|importo/i.test(x)),nums=(totals.join(' ')||t).match(/\d{1,6}[.,]\d{2}/g)||[];$('importo').value=nums.length?Math.max(...nums.map(x=>parseFloat(x.replace(',','.')))).toFixed(2):'';$('valuta').value=/€|EUR/i.test(t)?'EUR':'CHF';let d=t.match(/\b([0-3]?\d)[./-]([01]?\d)[./-](20\d{2}|\d{2})\b/);if(d){let y=d[3].length==2?'20'+d[3]:d[3];$('data').value=`${y}-${d[2].padStart(2,'0')}-${d[1].padStart(2,'0')}`}}async function addExpense(){if(!ready||writing)return alert('Attendi il database locale.');if(busy)return alert('Attendi la fine della lettura.');let a=parseFloat($('importo').value);if(!a||!$('data').value)return alert('Inserisci data e importo.');expenses.push({id:Date.now(),date:$('data').value,merchant:$('esercente').value||'Spesa',amount:a,currency:$('valuta').value,image:img,attachmentName});try{await save()}catch(e){expenses.pop();return alert('Salvataggio non riuscito: verifica lo spazio disponibile.')}$('esercente').value='';$('importo').value='';img='';attachmentName='';$('filename').textContent='';$('status').textContent='';$('preview').classList.add('hidden');$('camera').value=''}async function save(){writing=true;try{await store(expenses);render()}finally{writing=false}}function filtered(){return expenses.filter(e=>e.date.slice(0,7)==$('mese').value).sort((a,b)=>a.date.localeCompare(b.date))}function render(){let f=filtered(),tot={};f.forEach(e=>tot[e.currency]=(tot[e.currency]||0)+e.amount);$('totals').innerHTML=Object.keys(tot).length?Object.entries(tot).map(([c,v])=>`<div class="total">${c} ${v.toFixed(2)}</div>`).join(''):'<div class="small">Nessuna spesa</div>';$('list').innerHTML=f.map(e=>`<div class="expense"><div><b>${esc(e.merchant)}</b><div class="small">${fmt(e.date)}</div>${e.image?`<button class="secondary" onclick="openAttachment(${e.id})">Apri allegato</button>`:""}</div><div style="text-align:right"><b>${e.currency} ${e.amount.toFixed(2)}</b><br><button class="danger" style="width:auto;padding:5px 9px" onclick="del(${e.id})">Elimina</button></div></div>`).join('')||'<div class="small">Nessuna spesa nel mese selezionato</div>'}function openAttachment(id){const e=expenses.find(x=>x.id===id);if(!e?.image)return;const a=document.createElement('a');a.href=e.image;a.download=e.attachmentName||'scontrino.jpg';a.click()}function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function fmt(d){let [y,m,g]=d.split('-');return `${g}/${m}/${y}`}async function del(id){if(!ready||writing)return;if(confirm('Eliminare questa spesa?')){let old=expenses;expenses=expenses.filter(e=>e.id!==id);try{await save()}catch(e){expenses=old;alert('Eliminazione non riuscita')}}}async function deleteRange(){if(!ready||writing)return;let a=$('dal').value,b=$('al').value;if(!a||!b||a>b)return alert('Controlla le date.');let n=expenses.filter(e=>e.date>=a&&e.date<=b).length;if(n&&confirm(`Eliminare ${n} spese?`)){let old=expenses;expenses=expenses.filter(e=>e.date<a||e.date>b);try{await save()}catch(e){expenses=old;alert('Eliminazione non riuscita')}}}function printReport(){let p=JSON.parse(localStorage.getItem('profile')||'{}'),f=filtered(),tot={};f.forEach(e=>tot[e.currency]=(tot[e.currency]||0)+e.amount);let rows=f.map(e=>`<tr><td>${fmt(e.date)}</td><td>${esc(e.merchant)}</td><td>${e.currency}</td><td style="text-align:right">${e.amount.toFixed(2)}</td></tr>`).join('');let w=window.open('','_blank');w.document.write(`<html><head><title>Nota Spese ${p.mese||''}</title><style>body{font-family:Arial;padding:35px;color:#222}h1{border-bottom:3px solid #222;padding-bottom:12px}table{width:100%;border-collapse:collapse;margin-top:25px}th,td{padding:9px;border-bottom:1px solid #ccc;text-align:left}.sig{margin-top:70px;display:flex;justify-content:space-between}.sig div{width:44%;border-top:1px solid #333;padding-top:8px}@media print{button{display:none}}</style></head><body><h1>NOTA SPESE</h1><p><b>Dipendente:</b> ${esc((p.nome||'')+' '+(p.cognome||''))}<br><b>Azienda:</b> ${esc(p.azienda||'')}<br><b>Mese:</b> ${p.mese||''}</p><table><thead><tr><th>Data</th><th>Descrizione</th><th>Valuta</th><th>Importo</th></tr></thead><tbody>${rows}</tbody></table><h3>Totali: ${Object.entries(tot).map(([c,v])=>c+' '+v.toFixed(2)).join(' · ')}</h3><p style="margin-top:45px">Dichiaro che le spese sopra indicate sono state sostenute nell'interesse dell'azienda.</p><div class="sig"><div>Luogo e data</div><div>Firma del dipendente</div></div><script>setTimeout(()=>window.print(),300)<\/script></body></html>`);w.document.close()}function store(items){return new Promise((resolve,reject)=>{const tx=db.transaction('archive','readwrite');tx.objectStore('archive').put(items,'expenses');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}function readArchive(){return new Promise((resolve,reject)=>{const q=db.transaction('archive').objectStore('archive').get('expenses');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}async function init(){try{db=await new Promise((resolve,reject)=>{const q=indexedDB.open('NotaSpeseLocal',1);q.onupgradeneeded=()=>q.result.createObjectStore('archive');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});let old=await readArchive();if(old===undefined){old=JSON.parse(localStorage.getItem('expenses')||'[]');await store(old)}expenses=old;ready=true;$('dbstatus').textContent='IndexedDB attivo · dati solo sul dispositivo';load()}catch(e){$('dbstatus').textContent='Archivio non disponibile. Non cancellare i dati del browser.';alert('Impossibile aprire archivio locale')}}async function compress(f){const url=URL.createObjectURL(f);try{const im=new Image();im.src=url;await im.decode();const scale=Math.min(1,2000/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.85)}finally{URL.revokeObjectURL(url)}}function backup(){if(!ready||writing)return;const b=new Blob([JSON.stringify({version:3,expenses,profile:JSON.parse(localStorage.getItem('profile')||'{}')})],{type:'application/json'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='NotaSpese-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),60000)}$('restore').addEventListener('change',async e=>{if(!ready||writing)return;try{const b=JSON.parse(await e.target.files[0].text());if(!Array.isArray(b.expenses)||!b.expenses.every(x=>Number.isFinite(x.id)&&Number.isFinite(x.amount)&&typeof x.date==='string'&&typeof x.merchant==='string'&&['CHF','EUR'].includes(x.currency)&&(!x.image|| (typeof x.image==='string' && (x.image.startsWith('data:image/')||x.image.startsWith('data:application/pdf'))))))throw Error('invalid');if(!confirm('Sostituire tutte le spese con il backup?'))return;writing=true;await store(b.expenses);expenses=b.expenses;if(b.profile)localStorage.setItem('profile',JSON.stringify(b.profile));load();alert('Backup ripristinato')}catch(err){alert('Ripristino non riuscito')}finally{writing=false;e.target.value=''}});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');init();</script></body></html>
